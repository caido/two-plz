[package]
name = "two-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
support = { path = "../support" }
tracing = "0.1.43"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio = { version = "1.48.0", features = ["macros", "net", "rt", "io-util", "rt-multi-thread"] }

[dev-dependencies]
rstest  = "0.26.1"
rcgen = "0.13.2"
rustls = "0.23.31"
tokio-rustls = "0.26.2"
tokio-tungstenite = { version = "0.30.0", default-features = false }
