[package]
name = "two-plz"
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace]
members = ["tests/two-tests", "tests/support"]

[dependencies]
bytes = "1.11.0"
fnv = "1.0.7"
futures = { version = "0.3.31", default-features = false, features = ["std"] }
futures-core = { version = "0.3.31", default-features = false }
futures-sink = { version = "0.3.31", default-features = false }
# Match the primitives revision pinned by http-plz to share public header types.
header-plz = { git = "ssh://git@github.com/caido/primitives.git", rev = "b24d61a8602d3dc19881641dd527ee727b6908ac" }
indexmap = { version = "2.2.6", features = ["std"] }
slab = "0.4.11"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util"] }
tokio-util = { version = "0.7.17", features = ["codec", "io"] }
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
http-plz = { git = "ssh://git@github.com/caido/http-plz.git", rev = "4bb74a150b5d17f9a05ed6550e25257411bd15ba" }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
env_logger = { version = "0.11", default-features = false }

# Fuzzing
quickcheck = { version = "1.0.3", default-features = false }
rand = "0.9"

# HPACK fixtures
hex = "0.4.3"
walkdir = "2.5.0"
serde = "1.0.0"
serde_json = "1.0.0"

rcgen = { version = "0.13.2", features = ["pem", "x509-parser"] }
rustls = "0.23.31"
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.12.0"
tokio-rustls = "0.26.2"
webpki-roots = "1.0.2"
tracing-subscriber = "0.3.20"

[features]
# Enables `futures::Stream` implementations for various types.
stream = []

# Enables **unstable** APIs. Any API exposed by this feature has no backwards
# compatibility guarantees. In other words, you should not use this feature for
# anything besides experimentation. Definitely **do not** publish a crate that
# depends on this feature.
unstable = []
test-util = []
